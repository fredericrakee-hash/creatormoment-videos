name: Count story votes (shortsfilm)

on:
  schedule:
    - cron: "17 * * * *"      # every hour: count votes
    - cron: "41 4 * * 1"      # every Monday: extend the Instagram token by 60 days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extend token
        if: github.event.schedule == '41 4 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python votes/count_votes.py --refresh
      - name: Count votes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python votes/count_votes.py
      - name: Save results
        run: |
          git config user.name "vote-counter"
          git config user.email "vote-counter@users.noreply.github.com"
          git add votes/results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "votes: update counts"
          git pull --rebase -q
          git push
